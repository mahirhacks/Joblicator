ollama:
  base_url: http://127.0.0.1:11434
  model: huihui_ai/gemma-4-abliterated:26b
  think: false
  auto_start: true
generation:
  temperature: 0.5             # default for uncategorized calls
  creative_temperature: 0.65   # prose drafting (summary, bullets, letter body)
  precise_temperature: 0.2     # reviews, scoring, claims, structured formatting
  context_window: 8192         # compact stage prompts are designed to fit this window
  top_p: 0.9
  repeat_penalty: 1.1
  seed: 0                      # >0 = reproducible sampling
batch_resilience:
  enabled: true
  continue_on_error: true      # one broken job never stops the remaining batch
  max_attempts_per_application: 3
  skip_fit_below: 5            # after retries, record a no-document outcome below this fit
  accept_low_quality_fit_at_most: 6  # valid 5-6/10-fit drafts may pass after review retries
  reuse_previous_success: true # preserve the last buildable draft during transient model failures
applications:
  json: applications/local_applications.json
profile:
  json: settings/local_profile.json
loops:
  max_keywords_total: 30
stages:
  stage_1: engine/dynamic_engine/data/stage_1.json
  stage_2: engine/dynamic_engine/data/stage_2.json
  stage_3: engine/dynamic_engine/data/stage_3.json
stage_2:
  keywords:
    max_original_keyword: 30   # feed all stage-1 groups to stage 2 — 7 starved ATS coverage
    max_synonym_keyword_per_original_keyword: 2
  grounding:
    skills_from_profile_only: true
    enforce_claims_manifest: true
  skills:
    domain_count: 5
    subskill_min: 1
    subskill_max: 6
  certifications:
    description_min_chars: 24
  style_verification:
    enabled: true
  verification:
    enabled: true
    min_quality: 7
    max_passes: 2
  parser_verification:
    enabled: true
    max_passes: 2
  parser_autofix:
    enabled: true
stage_3:
  body_paragraphs: 2
  body_paragraph:
    max_words: 110
  honesty:
    use_stage_2_claims: true
    # Gaps stay in metadata and claims checks; cover letters never volunteer weaknesses.
    max_gaps_in_letter: 3
  style_verification:
    enabled: true
  verification:
    enabled: true
    min_quality: 7
    max_passes: 2
  parser_verification:
    enabled: true
    max_passes: 2
    fail_on_unresolved: true
  parser_autofix:
    enabled: true
