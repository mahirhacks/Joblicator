# Dynamic engine — local Ollama LLM settings

ollama:
  base_url: http://127.0.0.1:11434
  model: gemma4:26b
  think: false
  auto_start: true

generation:
  temperature: 0.5
  context_window: 8192

applications:
  json: applications/local_applications.json

profile:
  json: settings/local_profile.json

loops:
  max_keywords_total: 30

stages:
  stage_1: engine/dynamic_engine/data/stage_1.json
  stage_2: engine/dynamic_engine/data/stage_2.json
  stage_3: engine/dynamic_engine/data/stage_3.json

stage_2:
  keywords:
    max_original_keyword: 7
    max_synonym_keyword_per_original_keyword: 2
  grounding:
    skills_from_profile_only: true
    enforce_claims_manifest: true
  skills:
    domain_count: 5
    subskill_min: 1
    subskill_max: 3
  certifications:
    description_min_chars: 24
  style_verification:
    enabled: true
  verification:
    enabled: true
    min_quality: 7
    max_passes: 4
  parser_verification:
    enabled: true
    max_passes: 3

stage_3:
  body_paragraphs: 2
  body_paragraph:
    max_words: 120
  honesty:
    use_stage_2_claims: true
    deterministic_gap_paragraph: true
    gap_paragraph_index: 2
  style_verification:
    enabled: true
  verification:
    enabled: true
    min_quality: 7
    max_passes: 3
  parser_verification:
    enabled: true
    max_passes: 2
